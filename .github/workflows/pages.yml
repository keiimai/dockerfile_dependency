name: Refresh runtime catalog and publish Pages

'on':
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'

permissions: {}

concurrency:
  group: dockerfile-dependency-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.cadence.outputs.publish }}
      verified_ref: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check biweekly cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          first_monday=$(date -u -d '2026-11-30 00:00:00' +%s)
          now=$(date -u +%s)
          if [[ "$EVENT_NAME" == push ]] || (( now >= first_monday && ((now - first_monday) / 604800) % 2 == 0 )); then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cadence.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
      - name: Verify native Docker connection
        if: steps.cadence.outputs.publish == 'true'
        run: |
          docker info
          test "$(uname -m)" = aarch64
      - name: Check official catalogs
        if: github.event_name == 'schedule' && steps.cadence.outputs.publish == 'true'
        run: python3 -B tools/update_catalog.py
      - name: Backfill digest evidence on source changes
        if: github.event_name == 'push' && steps.cadence.outputs.publish == 'true'
        run: python3 -B tools/update_catalog.py --hash-provenance
      - name: Record verified CRAN Archive artifacts
        if: steps.cadence.outputs.publish == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            node tools/update_archive_hashes.mjs --refresh
          else
            node tools/update_archive_hashes.mjs
          fi
      - name: Validate refreshed data
        if: steps.cadence.outputs.publish == 'true'
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Build and start new CPython series on each target OS
        if: steps.cadence.outputs.publish == 'true'
        run: node tools/verify_python_series.mjs
      - name: Commit verified updates
        if: steps.cadence.outputs.publish == 'true'
        run: |
          git add dist/runtime-catalog.mjs dist/data/ubuntu-*-arm64.json.gz dist/build-records.mjs dist/archive-hashes.mjs tools/archive-cursor.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh R and Python runtime catalogs'
            git push origin HEAD:main
          fi
      - name: Record verified revision
        id: version
        if: steps.cadence.outputs.publish == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare static site
        if: steps.cadence.outputs.publish == 'true'
        run: |
          mkdir -p _tmp/pages
          cp index.html _tmp/pages/
          cp -R dist _tmp/pages/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.cadence.outputs.publish == 'true'
        with:
          path: _tmp/pages

  browser:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.verified_ref }}
          persist-credentials: false
      - run: node tools/check_browser.mjs

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: [prepare, browser]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  public-site:
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.verified_ref }}
          persist-credentials: false
      - name: Verify published downloads against live repositories
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/check_browser.mjs
