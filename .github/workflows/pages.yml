name: Refresh runtime catalog and publish Pages

'on':
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * *'

permissions: {}

concurrency:
  group: dockerfile-dependency-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check official catalogs
        run: python3 -B tools/update_catalog.py
      - name: Validate refreshed data
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Commit verified updates
        run: |
          git add dist/runtime-catalog.mjs dist/data/ubuntu-*-arm64.json.gz
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh R and Python runtime catalogs'
            git push origin HEAD:main
          fi
      - name: Prepare static site
        run: |
          mkdir -p _tmp/pages
          cp index.html _tmp/pages/
          cp -R dist _tmp/pages/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _tmp/pages

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
